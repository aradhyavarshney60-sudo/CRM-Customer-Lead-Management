{% extends "layout.html" %}
{% block title %}Login - CRM{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-4">
            <h3 class="fw-bold text-center mb-3">CRM Login</h3>
            <p class="text-muted text-center small mb-4">Default Admin: <b>admin</b> / <b>admin123</b></p>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>
            </form>
            <div class="text-center mt-3">
                <small>Need an account? <a href="{{ url_for('register') }}">Sign Up</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
